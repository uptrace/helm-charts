{{- /*
The config of the new release, for the pre-install and pre-upgrade hooks. The
ConfigMap of the release itself does not exist yet or still holds the old config
while they run. The validate Job and the expand Job of the migrations mount it.
*/ -}}
{{- if or (not .Values.uptrace.configValidate.disabled) (not .Values.uptrace.migrate.disabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uptrace.fullname" . }}-validate
  labels:
    {{- include "uptrace.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  uptrace.yml: |
{{ tpl (toYaml .Values.uptrace.config) $ | indent 4 }}
{{- end }}
