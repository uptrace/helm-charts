{{- /*
The Secret that holds service.secret. The config reads it as ${UPTRACE_SECRET}.
A value in uptrace.secret wins. Otherwise the first install generates a random
secret, and each later render reads it back with lookup, so it does not change.

It is a pre-install and pre-upgrade hook, so that it exists before the validate
Job and the expand Job run. Helm does not track a hook in the release, so
`helm uninstall` keeps the Secret, and a later install reuses it.
*/ -}}
{{- include "uptrace.checkSecret" . }}
{{- $name := include "uptrace.secretName" . }}
{{- $secret := .Values.uptrace.secret }}
{{- if not $secret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "secret") }}
{{- $secret = index $existing.data "secret" | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "uptrace.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  secret: {{ $secret | b64enc | quote }}
